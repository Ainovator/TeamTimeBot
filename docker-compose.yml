services:
  db:
    image: postgres:16-alpine
    container_name: teamtimebot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamtimebot} -d ${POSTGRES_DB:-teamtimebot}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtimebot-bot-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtimebot-web-local
    restart: unless-stopped
    entrypoint: ["/web"]
    env_file:
      - .env
    environment:
      WEB_ADDR: ${WEB_ADDR:-:8080}
      WEB_STATIC_DIR: ${WEB_STATIC_DIR:-}
      WEB_TELEGRAM_LOGIN_BOT: ${WEB_TELEGRAM_LOGIN_BOT:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      POSTGRES_HOST: db
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: teamtimebot-frontend-local
    working_dir: /app/web
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/app
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://web:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
