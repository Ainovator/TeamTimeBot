<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamTime</title>
    <script>
      // Apply the saved product theme before the first paint. The design lab has its own themes.
      if (!/^\/design-lab\/?$/.test(location.pathname)) {
        let theme = 'club';
        try {
          const saved = localStorage.getItem('teamtime-theme-v2');
          if (saved === 'arena' || saved === 'light' || saved === 'cherry' || saved === 'club') theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
      }
    </script>
    <style>
      html[data-theme="arena"] { background:#101c30; color:#edf2f7; color-scheme:dark; }
      html[data-theme="cherry"] { background:#171416; color:#f2e9e5; color-scheme:dark; }
      html[data-theme="light"] { background:#f5f6f4; color:#283631; color-scheme:light; }
      html[data-theme="club"] { background:#eef2f6; color:#142b49; color-scheme:light; }
      .tt-startup { box-sizing:border-box; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; background:#eef2f6; color:#142b49; font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; text-align:center; }
      .tt-startup h1 { font-size:27px; letter-spacing:-1px; margin:0 0 16px; }
      .tt-startup p { max-width:360px; margin:10px auto; }
      .tt-startup button { border:0; border-radius:8px; padding:12px 18px; margin-top:10px; color:#fff; background:#3267cf; font:inherit; cursor:pointer; }
    </style>
  </head>
  <body>
    <div id="root"><main class="tt-startup"><section>
      <h1>TeamTime</h1>
      <p id="boot-status" role="status">Загружаем TeamTime…</p>
      <div id="boot-retry" hidden><p>Проверьте подключение и обновите страницу.</p><button type="button" onclick="window.location.reload()">Обновить страницу</button></div>
      <noscript>Для входа включите JavaScript в настройках браузера.</noscript>
    </section></main></div>
    <script>
      // This fallback also works when the main JavaScript file fails to load.
      (function () {
        function showBootError() {
          var status = document.getElementById('boot-status');
          var retry = document.getElementById('boot-retry');
          if (!status || !retry) return;
          status.textContent = 'Не удалось загрузить приложение.';
          retry.hidden = false;
        }
        window.setTimeout(showBootError, 15000);
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') showBootError();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
