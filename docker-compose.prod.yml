services:
  db:
    image: postgres:16-alpine
    container_name: teamtimebot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamtimebot} -d ${POSTGRES_DB:-teamtimebot}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtimebot-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
