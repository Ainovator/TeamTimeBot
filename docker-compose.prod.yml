services:
  db:
    image: postgres:16-alpine
    container_name: teamtimebot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamtimebot} -d ${POSTGRES_DB:-teamtimebot}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    # Expose Postgres only on server localhost so we can connect via SSH tunnel (e.g. DBeaver).
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtimebot-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtimebot-web
    restart: unless-stopped
    entrypoint: ["/web"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEB_ADDR: ${WEB_ADDR:-:8080}
      WEB_STATIC_DIR: ${WEB_STATIC_DIR:-/web-static}
      WEB_TELEGRAM_LOGIN_BOT: ${WEB_TELEGRAM_LOGIN_BOT:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-teamtimebot}
      POSTGRES_USER: ${POSTGRES_USER:-teamtimebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamtimebot}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      TZ: ${TZ:-UTC}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
